<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List | Gestor de Tareas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Mis Tareas</h1>
            <p class="subtitle">Organizador personal de pendientes con prioridades</p>
        </header>

        <div id="errorBanner" class="error-banner" role="alert"></div>

        <form id="taskForm" class="form-row">
            <input type="text" id="taskInput" placeholder="¿Qué necesitas hacer hoy?..." required autocomplete="off">
            <select id="taskPriority" aria-label="Prioridad de la tarea">
                <option value="Baja">Baja</option>
                <option value="Media" selected>Media</option>
                <option value="Alta">Alta</option>
            </select>
            <button type="submit" class="btn btn-primary">Agregar</button>
        </form>

        <div class="filters-bar">
            <div class="filter-tabs" role="tablist">
                <button type="button" class="filter-btn active" data-filter="all">Todas</button>
                <button type="button" class="filter-btn" data-filter="pending">Pendientes</button>
                <button type="button" class="filter-btn" data-filter="completed">Completadas</button>
            </div>
            <span id="taskCounter" class="task-counter">Cargando tareas...</span>
        </div>

        <ul id="taskList" aria-live="polite"></ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
