[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-web-fastapi"
version = "1.0.0"
description = "Aplicación web full-stack para gestión de tareas construida con FastAPI, SQLite y JavaScript Vanilla"
authors = [
    { name = "Carlos Alejandro Coronel Quilachamin" },
    { name = "David Alejandro Cruz Palacios" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]